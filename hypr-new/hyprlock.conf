# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# :: HYPRLOCK — Noctalia-matched lock screen (Gruvbox)         --
# :: Palette mirrors noctalia/colors.json (predefinedScheme =   --
# :: Gruvbox, useWallpaperColors = false). Loaded automatically --
# :: from ~/.config/hypr/hyprlock.conf (→ hypr-new/).           --
# ::                                                            --
# :: Triggered by:                                              --
# ::   - Super+Alt+L            (hyprland.lua keybind)          --
# ::   - Noctalia idle timeout  (settings.json customCommands)  --
# ::   - Before suspend / lid   (hypridle.conf + lid-close.sh)  --
# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --

# :: Noctalia Gruvbox palette (noctalia/colors.json). Keep in sync if the
# :: Noctalia scheme changes; hyprlock has no dynamic color source here.
$surface      = rgb(282828)   # :: mSurface       (base background)
$surfaceVar   = rgb(3c3836)   # :: mSurfaceVariant (input inner)
$onSurface    = rgb(fbf1c7)   # :: mOnSurface      (primary text)
$onSurfaceVar = rgb(ebdbb2)   # :: mOnSurfaceVariant (dim text)
$primary      = rgb(b8bb26)   # :: mPrimary   (green  — input outline)
$secondary    = rgb(fabd2f)   # :: mSecondary (yellow — checking)
$tertiary     = rgb(83a598)   # :: mTertiary  (blue   — user label)
$error        = rgb(fb4934)   # :: mError     (red    — auth fail)
$outline      = rgb(57514e)   # :: mOutline

# :: Lock wallpaper. Defaults to Noctalia's current wallpaper; point it at any
# :: image in ~/Pictures/wallpapers. Use the literal `screenshot` (in the
# :: background block below) instead for a blurred snapshot of the desktop.
$wallpaper = ~/Pictures/wallpapers/mecha-nostalgia.png
 
general {
    hide_cursor        = true
    ignore_empty_input = true   # :: Enter on an empty field does nothing
}

# :: Wallpaper background (softly blurred + dimmed for text legibility) — NOT a
# :: screenshot of your open windows. Set blur_passes = 0 for a crisp wallpaper.
background {
    monitor    =
    path       = $wallpaper
    blur_passes  = 2
    blur_size    = 4
    noise        = 0.0
    contrast     = 1.0
    brightness   = 0.75
    vibrancy     = 0.15
    vibrancy_darkness = 0.1
}

animations {
    enabled = true
}

# :: Clock — vertical, HH stacked over MM (24h).
label {
    monitor     =
    text        = cmd[update:1000] echo "<b>$(date +'%H')</b>"
    color       = $onSurface
    font_size   = 100
    font_family = FiraCode Nerd Font Mono
    position    = 0, 190
    halign      = center
    valign      = center
}
label {
    monitor     =
    text        = cmd[update:1000] echo "<b>$(date +'%M')</b>"
    color       = $onSurface
    font_size   = 100
    font_family = FiraCode Nerd Font Mono
    position    = 0, 65
    halign      = center
    valign      = center
}

# :: Date (Weekday, DD Month). Delete this whole block for a pure HH/MM/password
# :: layout like the mockup — I kept it since you only asked to drop the username.
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color       = $onSurfaceVar
    font_size   = 18
    font_family = FiraCode Nerd Font Mono
    position    = 0, -55
    halign      = center
    valign      = center
}

# :: Password input
input-field {
    monitor          =
    size             = 340, 56
    position         = 0, -165
    halign           = center
    valign           = center

    outline_thickness = 2
    rounding          = 12

    inner_color = $surfaceVar
    outer_color = $primary
    font_color  = $onSurface
    check_color = $secondary   # :: while PAM verifies
    fail_color  = $error       # :: on a bad password

    # :: `##` = a literal `#` (a single `#` starts a comment in hyprlang).
    placeholder_text = <span foreground="##ebdbb2">󰌾  Locked — enter password</span>
    fail_text        = <span foreground="##282828"><b>$PAMFAIL ($ATTEMPTS)</b></span>

    font_family  = FiraCode Nerd Font Mono
    dots_size    = 0.25
    dots_spacing = 0.3
    dots_center  = true

    fade_on_empty = false
    shadow_passes = 0
}

# :: Fingerprint unlock (fprintd) — matches the intent of Noctalia's
# :: general.allowPasswordWithFprintd. No-op if no reader is enrolled.
auth {
    fingerprint:enabled = true
}
